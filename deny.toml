# cargo deny: advisories, licences, bans and sources. Runs in CI on every pull
# request (RULES.md BL-SEC-8, BL-DEP-2, BL-DEP-3).

[graph]
all-features = true

[advisories]
# Every advisory fails the check unless listed here with a reason and a review date.
ignore = [
  # Both arrive through syntect, the code highlighter comrak uses (task 1.6),
  # and both are flagged unmaintained, not vulnerable. Review again 2027-04-26,
  # or sooner if syntect moves off them or an actual vulnerability is filed.
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.x: syntect only decodes its own grammar data, embedded in the binary at build time, never input from a user" },
  { id = "RUSTSEC-2024-0320", reason = "yaml-rust: only on comrak's wasm32 and iOS build path, which Khalid never builds; no YAML from users goes through it" },
  # The share image draws with these directly (G14): they shape and outline
  # the embedded DejaVu face offline at publish time. No font from a user
  # runs through them and neither is vulnerable, only without a maintainer.
  # Review again 2027-04-26, or sooner if a maintained fork appears.
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser: used only by khalid-share-image, which reads only the one DejaVu face Khalid embeds, parsed at first draw; untrusted downloads are measured by read-fonts instead" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz: used only by khalid-share-image, which shapes only titles and site names from the site's own content; the same engine resvg shipped before" },
  # Both arrive through crypto-glue under webauthn-rs (phase-geo S1) and are
  # timing leaks in work on secret keys. Khalid only checks passkey signatures
  # with public keys and never holds a passkey's private key; only the tests'
  # software passkey signs. Review again 2027-04-26, or when webauthn-rs moves
  # to RustCrypto releases with the fixes.
  { id = "RUSTSEC-2023-0071", reason = "rsa: the Marvin attack needs private-key decryption or signing; Khalid only verifies RS256 passkey signatures with public keys" },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5: the leaks are in arithmetic on secret integers; passkey checks use public keys and public signatures only" },
]

[licenses]
# Permissive licences only, so SerpDad can reuse every crate in its closed
# backend (BL-DEP-2). MPL-2.0 needs a named exception per crate below.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  # The Unicode data licence before 3.0; permissive, used by finl_unicode, a
  # dependency of the markdown parser comrak.
  "Unicode-DFS-2016",
  "Zlib",
  "0BSD",
]
# Named MPL-2.0 exceptions. MPL is file-level: SerpDad may link these
# unmodified in a closed build, and only changes to their own files would
# have to be shared.
exceptions = [
  # Servo's CSS and selector parsers, reached through scraper, which
  # docs/standards/rust.md names for reading a site's HTML in theme sync.
  # File events for `khalid serve` (CTO answers 2026-10-27, section 1); CC0 is public domain.
  { crate = "notify", allow = ["CC0-1.0"] },
  { crate = "cssparser", allow = ["MPL-2.0"] },
  { crate = "cssparser-macros", allow = ["MPL-2.0"] },
  { crate = "dtoa-short", allow = ["MPL-2.0"] },
  { crate = "selectors", allow = ["MPL-2.0"] },
  # Our own two published crates keep the product's licence
  # (docs/adr/0000-the-lint-crates-are-published-under-agpl.md). The allow-list
  # above still governs everything they depend on.
  { crate = "khalid-core", allow = ["AGPL-3.0-only"] },
  { crate = "khalid-lint", allow = ["AGPL-3.0-only"] },
  # Passkeys (phase-geo S1): webauthn-rs and its parts, which check passkeys
  # on RustCrypto through crypto-glue, with no OpenSSL.
  { crate = "crypto-glue", allow = ["MPL-2.0"] },
  { crate = "webauthn-attestation-ca", allow = ["MPL-2.0"] },
  { crate = "webauthn-rs", allow = ["MPL-2.0"] },
  { crate = "webauthn-rs-core", allow = ["MPL-2.0"] },
  { crate = "webauthn-rs-proto", allow = ["MPL-2.0"] },
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# The allow-list is for dependencies. Our own crates are AGPL-3.0 and, apart
# from khalid-core and khalid-lint, never published (publish = false in the
# workspace), so the licence check skips them.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Crates we never want. Each has a reason.
deny = [
  { crate = "openssl", reason = "rustls everywhere; one TLS stack, no system library" },
  { crate = "openssl-sys", reason = "rustls everywhere; one TLS stack, no system library" },
  { crate = "anyhow", wrappers = ["khalid"], reason = "libraries use thiserror enums (BL-ERR-1); only the binary may wrap" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
