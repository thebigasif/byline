# Spelling check for code, docs and messages. Runs in scripts/check.sh and CI.
[default]
extend-ignore-re = [
  # hashed asset names and ids in fixtures
  "[0-9a-f]{32,}",
]

[default.extend-words]
# Project words typos would otherwise flag.
serpdad = "serpdad"
khalid = "khalid"
hreflang = "hreflang"
minijinja = "minijinja"
# The German transliteration of ü, as in "ueber" for "über" (slugs, task 1.3).
ue = "ue"
# "Search" in German, a menu label in the demo example.
suche = "suche"

[files]
# typos knows English only. German content is checked by its writer, not by
# an English dictionary that reads "Sie" and "ein" as typos.
extend-exclude = [
  "target/",
  "node_modules/",
  "*.lock",
  ".claude/skills/rust-best-practices/references/",
  "**/content/de/",
  "crates/khalid-render/strings/de.toml",
  "crates/khalid-newsletter/strings/de.toml",
  "crates/khalid-lint/src/german.rs",
]
