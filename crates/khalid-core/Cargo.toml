[package]
name = "khalid-core"
version = "0.0.0"
description = "Shared building blocks for every Khalid crate: messages, identifiers, time and settings."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# FixedClock and other test doubles, for this crate's tests and other crates' tests.
test-util = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde.workspace = true
thiserror.workspace = true
toml = "0.9"
unicode-normalization = "0.1"
url = "2"

[dev-dependencies]
khalid-core = { path = ".", version = "0.0.0", features = ["test-util"] }
proptest = "1"
tempfile = "3"
serde_json.workspace = true

[lints]
workspace = true
