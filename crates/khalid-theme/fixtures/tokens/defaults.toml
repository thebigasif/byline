# The blog's colours, fonts and shape, read by the templates as CSS
# variables. `khalid theme sync` writes this file from the main site.
# Every value may be edited by hand.

[colors]
background = "#ffffff"
surface = "#f6f7f9"
text = "#1f2328"
muted = "#57606a"
link = "#0b57d0"
accent = "#0b57d0"
border = "#d0d7de"

[fonts]
body = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
heading = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[shape]
radius = "0.375rem"
measure = "68ch"
