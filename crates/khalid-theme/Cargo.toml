[package]
name = "khalid-theme"
version = "0.0.0"
description = "Theme sync: read a main site's colours, fonts and logo into theme tokens, and fix contrast."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
khalid-core = { path = "../khalid-core", version = "0.0.0" }
khalid-outbound = { path = "../khalid-outbound", version = "0.0.0" }
scraper = "0.29"
serde.workspace = true
thiserror.workspace = true
toml = "0.9"
url = "2"
read-fonts = "0.41"

[dev-dependencies]
khalid-outbound = { path = "../khalid-outbound", version = "0.0.0", features = ["test-util"] }
tempfile = "3"
tokio.workspace = true
wiremock = "0.6"

[lints]
workspace = true
