[package]
name = "khalid"
version = "0.0.0"
description = "An open-source blog engine with SEO defaults built in, by SerpDad."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
khalid-api = { path = "../khalid-api", version = "0.0.0" }
khalid-content = { path = "../khalid-content", version = "0.0.0" }
khalid-core = { path = "../khalid-core", version = "0.0.0" }
khalid-routes = { path = "../khalid-routes", version = "0.0.0" }
khalid-db = { path = "../khalid-db", version = "0.0.0" }
khalid-lint = { path = "../khalid-lint", version = "0.0.0" }
khalid-media = { path = "../khalid-media", version = "0.0.0" }
khalid-render = { path = "../khalid-render", version = "0.0.0" }
khalid-seo = { path = "../khalid-seo", version = "0.0.0" }
khalid-server = { path = "../khalid-server", version = "0.0.0" }
khalid-outbound = { path = "../khalid-outbound", version = "0.0.0" }
khalid-theme = { path = "../khalid-theme", version = "0.0.0" }
chrono = { version = "0.4", default-features = false }
clap = { version = "4", features = ["derive"] }
mimalloc = "0.1"
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["rt", "net", "sync"] }
toml = "0.9"
tracing.workspace = true

[features]
# The hidden --test-hosts flag, for CLI tests against a local stand-in.
# Release builds leave it off, so the private-network guard has no switch.
test-util = ["khalid-outbound/test-util"]

[dev-dependencies]
khalid-core = { path = "../khalid-core", version = "0.0.0", features = ["test-util"] }
image = { version = "0.25", default-features = false, features = ["png"] }
insta = "1"
scraper = "0.29"
serde_json.workspace = true
tokio.workspace = true
wiremock = "0.6"

[[test]]
name = "theme"
required-features = ["test-util"]

[lints]
workspace = true
