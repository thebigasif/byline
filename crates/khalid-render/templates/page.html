{% extends "base.html" %}
{% block main %}
<article class="page">
<h1>{{ page.title }}</h1>
<div class="page-body">
{{ page.body }}
</div>
{% if page.updated %}<p class="page-updated">{{ t.updated }} <time datetime="{{ page.updated }}">{{ page.updated | date }}</time></p>
{% endif %}</article>
{% endblock %}
