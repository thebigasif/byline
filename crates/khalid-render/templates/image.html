{#- picture(image): a responsive image with its space reserved (BL-WEB-5). -#}
{% macro picture(image) -%}
<figure class="image">
<picture>
{% if image.avif %}<source type="image/avif" srcset="{{ image.avif.srcset }}" sizes="{{ image.sizes }}">
{% endif %}{% if image.webp %}<source type="image/webp" srcset="{{ image.webp.srcset }}" sizes="{{ image.sizes }}">
{% endif %}<img src="{{ image.fallback.src }}" srcset="{{ image.fallback.srcset }}" sizes="{{ image.sizes }}" width="{{ image.width }}" height="{{ image.height }}" alt="{{ image.alt }}"{% if image.loading == "eager" %} fetchpriority="high"{% else %} loading="lazy"{% endif %} decoding="async">
</picture>
{% if image.caption %}<figcaption>{{ image.caption }}</figcaption>
{% endif %}</figure>
{%- endmacro %}
