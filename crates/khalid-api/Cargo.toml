[package]
name = "khalid-api"
version = "0.0.0"
description = "The Content API and the Admin API: routes, the shared query grammar, keys and problem details."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# MemoryContentStore, for this crate's tests and other crates' tests.
test-util = []

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "query"] }
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }
khalid-core = { path = "../khalid-core", version = "0.0.0" }
serde.workspace = true
thiserror.workspace = true
utoipa = { version = "6", features = ["chrono"] }

[dev-dependencies]
khalid-api = { path = ".", version = "0.0.0", features = ["test-util"] }
proptest = "1"
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
