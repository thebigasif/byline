[package]
name = "khalid-api"
version = "0.0.0"
description = "The Content API and the Admin API: routes, the shared query grammar, keys and problem details."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# MemoryContentStore and MemoryKeyStore, for this crate's tests and other crates' tests.
test-util = []

[dependencies]
ammonia = "4"
argon2 = "0.6"
axum = { version = "0.8", default-features = false, features = ["json", "original-uri", "query", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }
getrandom = "0.4"
hmac = "0.13"
htmd = "0.5"
khalid-core.workspace = true
khalid-lint.workspace = true
khalid-media = { path = "../khalid-media", version = "0.0.0" }
khalid-seo = { path = "../khalid-seo", version = "0.0.0" }
khalid-webhooks = { path = "../khalid-webhooks", version = "0.0.0" }
serde.workspace = true
sha2 = "0.11"
subtle = "2"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tracing.workspace = true
utoipa = { version = "6", features = ["chrono"] }
utoipa-axum = "0.3"

[dev-dependencies]
khalid-api = { path = ".", version = "0.0.0", features = ["test-util"] }
khalid-core = { workspace = true, features = ["test-util"] }
proptest = "1"
serde_json.workspace = true
tempfile = "3"
tokio.workspace = true
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
