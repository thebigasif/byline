[package]
name = "khalid-newsletter"
version = "0.0.0"
description = "Subscribers and newsletters: sign-up with double opt-in, one-click unsubscribe, and the emails they send."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# MemoryMailer, the fake mail transport, for this crate's tests and other crates' tests.
test-util = []

[dependencies]
axum = { version = "0.8", default-features = false, features = [
  "form",
  "query",
] }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
getrandom = "0.4"
khalid-core = { path = "../khalid-core", version = "0.0.0" }
serde.workspace = true
sha2 = "0.11"
thiserror.workspace = true
toml = "0.9"
tracing.workspace = true

[dev-dependencies]
# khalid-db implements SubscriberStore, so the flow is tested against SQLite.
khalid-core = { path = "../khalid-core", version = "0.0.0", features = [
  "test-util",
] }
khalid-db = { path = "../khalid-db", version = "0.0.0" }
khalid-newsletter = { path = ".", version = "0.0.0", features = ["test-util"] }
tempfile = "3"
tokio.workspace = true
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
