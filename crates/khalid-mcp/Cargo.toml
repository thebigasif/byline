[package]
name = "khalid-mcp"
version = "0.0.0"
description = "The Model Context Protocol server behind khalid mcp, a client of the same functions the API calls."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false }
form_urlencoded = "1"
khalid-api = { path = "../khalid-api", version = "0.0.0" }
khalid-core.workspace = true
percent-encoding = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
chrono = { version = "0.4", default-features = false }
khalid-api = { path = "../khalid-api", version = "0.0.0", features = ["test-util"] }
tokio.workspace = true

[lints]
workspace = true
