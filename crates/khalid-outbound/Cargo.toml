[package]
name = "khalid-outbound"
version = "0.0.0"
description = "The one HTTP client for every outbound request, with the private-network guard."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Resolver::for_tests and Reach::PublicAndLoopback, for this crate's tests and
# other crates' tests.
test-util = []

[dependencies]
khalid-core.workspace = true
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
khalid-outbound = { path = ".", version = "0.0.0", features = ["test-util"] }
tokio.workspace = true
wiremock = "0.6"

[lints]
workspace = true
