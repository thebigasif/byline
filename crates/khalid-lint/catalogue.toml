# Every message the linter can show, one table per rule ID.
#
# Each message is three sentences for a writer who is new to SEO: what is
# wrong, why it matters, and what to do. `guide` names the SerpDad guide that
# explains the rule at length. tests/messages.rs checks every entry.

[no-date]
what = "This post has no date."
why = "Google and readers use dates to judge freshness."
fix = "Add `date:` to the header."
guide = "post-dates"

[no-author]
what = "This post has no author."
why = "People and search engines trust content with a named writer."
fix = "Add `author:` to the header and give that author a profile."
guide = "post-authors"

[no-internal-link]
what = "This post links to none of your other posts."
why = "Internal links are how readers and Google find the rest of your site."
fix = "Add one link to a related post."
guide = "internal-links"

[no-title]
what = "This post has no title."
why = "A page needs exactly one headline, and Google shows it in search results."
fix = "Add `title:` to the header."
guide = "post-titles"

[many-headlines]
what = "This post has more than one main headline."
why = "A page needs exactly one headline, so readers and Google know its topic."
fix = "Change each extra `#` headline in the text to a `##` subheading."
guide = "post-titles"

[reused-link-text]
what = "These link words already point to a different page on your site."
why = "Google reads link words as a label, and one label should mean one page."
fix = "Change the link words, or point the link at the same page as before."
guide = "link-text"

[repeated-link-text]
what = "Too many links to this page use these exact words."
why = "Varied link words tell Google more about what the page covers."
fix = "Rewrite these link words to fit what this post says about the page."
guide = "link-text"

[vague-link-text]
what = "This link uses vague words such as \"click here\" or \"read more\"."
why = "Readers and Google use the link words to know where a link goes."
fix = "Rewrite the link so its words name the page it opens."
guide = "link-text"

[same-target-twice]
what = "This post links to the same page more than once."
why = "Google counts only the first link to a page, so the others add nothing."
fix = "Remove the extra link, or point it at another useful page."
guide = "internal-links"

[empty-link-text]
what = "This link has no words a reader can see or hear."
why = "People using screen readers and Google cannot tell where it goes."
fix = "Add words to the link, or describe the image inside it."
guide = "link-text"

[heading-order]
what = "This heading skips a level, such as a `####` right after a `##`."
why = "Screen readers and Google follow headings like a table of contents."
fix = "Change this heading to one level below the heading before it."
guide = "headings"

[missing-alt]
what = "This image has no description."
why = "People who cannot see the image, and Google, rely on the description to know what it shows."
fix = "Add a short description of what the image shows."
guide = "image-descriptions"

[thin-post]
what = "This post is shorter than the minimum this site sets."
why = "Short posts rarely answer a question fully, so Google seldom shows them."
fix = "Add the details, examples or steps a reader needs to act on the topic."
guide = "post-length"

[no-outbound-link]
what = "This post links to no other website."
why = "Links to good sources show readers and Google where your facts come from."
fix = "Add a link to a trusted source that backs up a claim in the post."
guide = "citing-sources"

[no-description]
what = "This post has no description."
why = "Search results show a description under the title, so without one Google picks any sentence."
fix = "Add `description:` to the header with one sentence that sums up the post."
guide = "descriptions"

[long-title]
what = "This post's title is longer than search results can show."
why = "Google cuts long titles short, so readers may not see the end of yours."
fix = "Shorten the title and keep the words that matter most at the start."
guide = "post-titles"

[long-description]
what = "This post's description is longer than search results can show."
why = "Google cuts long descriptions short, so the end of yours may never be read."
fix = "Shorten the description to one or two short sentences."
guide = "descriptions"

[duplicate-title]
what = "Another post on this site has the same title."
why = "Google may show only one of the two, and readers cannot tell them apart."
fix = "Change the title so it says what makes this post different."
guide = "post-titles"

[duplicate-description]
what = "Another post on this site has the same description."
why = "A shared description makes two posts look the same in search results."
fix = "Rewrite the description so it sums up this post alone."
guide = "descriptions"

[keyword-stuffing]
what = "One phrase appears so often that the post reads as if written for machines."
why = "Google treats heavy repetition as spam and may show the post less."
fix = "Rewrite some of those sentences with other words, or cut the repeats."
guide = "keyword-stuffing"

[long-slug]
what = "This post's web address is long."
why = "Short addresses are easier to read, share and remember."
fix = "Shorten `slug:` to the few words that name the topic, before you publish."
guide = "web-addresses"

[slug-stopwords]
what = "This post's web address holds filler words such as \"the\" or \"of\"."
why = "Filler words make the address longer without telling readers or Google anything."
fix = "Remove the filler words from `slug:` before you publish."
guide = "web-addresses"

[slug-date]
what = "This post's web address holds a year."
why = "A year in the address makes the post look old once that year has passed."
fix = "Remove the year from `slug:` before you publish."
guide = "web-addresses"

[broken-wikilink]
what = "This `[[link]]` matches no post, page or glossary term in this language."
why = "Readers who follow it land on a page that does not exist."
fix = "Change it to the address of an existing page, or remove the brackets."
guide = "wikilinks"

[orphan-post]
what = "No other post on your site links to this post."
why = "Readers and Google find posts by following links, so this one is hard to find."
fix = "Add a link to this post from one or two related posts."
guide = "internal-links"

[one-inbound-link]
what = "Only one other post links to this post."
why = "A post with few links pointing to it looks less important to Google."
fix = "Link to this post from two or three more related posts."
guide = "internal-links"

[too-deep]
what = "Readers need too many clicks to reach this post from your home page."
why = "Google visits pages near the home page more often, and readers give up on long paths."
fix = "Link to this post from your home page, a menu or a popular post."
guide = "site-structure"
