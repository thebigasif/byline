# Every message the linter can show, one table per rule ID.
#
# Each message is three sentences for a writer who is new to SEO: what is
# wrong, why it matters, and what to do. `guide` names the SerpDad guide that
# explains the rule at length. tests/messages.rs checks every entry.

[no-date]
what = "This post has no date."
why = "Google and readers use dates to judge freshness."
fix = "Add `date:` to the header."
guide = "post-dates"

[no-author]
what = "This post has no author."
why = "People and search engines trust content with a named writer."
fix = "Add `author:` to the header and give that author a profile."
guide = "post-authors"

[no-internal-link]
what = "This post links to none of your other posts."
why = "Internal links are how readers and Google find the rest of your site."
fix = "Add one link to a related post."
guide = "internal-links"

[no-title]
what = "This post has no title."
why = "A page needs exactly one headline, and Google shows it in search results."
fix = "Add `title:` to the header."
guide = "post-titles"

[many-headlines]
what = "This post has more than one main headline."
why = "A page needs exactly one headline, so readers and Google know its topic."
fix = "Change each extra `#` headline in the text to a `##` subheading."
guide = "post-titles"

[reused-link-text]
what = "These link words already point to a different page on your site."
why = "Google reads link words as a label, and one label should mean one page."
fix = "Change the link words, or point the link at the same page as before."
guide = "link-text"

[repeated-link-text]
what = "Too many links to this page use these exact words."
why = "Varied link words tell Google more about what the page covers."
fix = "Rewrite these link words to fit what this post says about the page."
guide = "link-text"

[vague-link-text]
what = "This link uses vague words such as \"click here\" or \"read more\"."
why = "Readers and Google use the link words to know where a link goes."
fix = "Rewrite the link so its words name the page it opens."
guide = "link-text"

[same-target-twice]
what = "This post links to the same page more than once."
why = "Google counts only the first link to a page, so the others add nothing."
fix = "Remove the extra link, or point it at another useful page."
guide = "internal-links"

[empty-link-text]
what = "This link has no words a reader can see or hear."
why = "People using screen readers and Google cannot tell where it goes."
fix = "Add words to the link, or describe the image inside it."
guide = "link-text"

[link-text-misses-target]
what = "These link words share no word with the title of the page they open."
why = "Google reads link words as a label for the page, and this label does not match it."
fix = "Rewrite the link with words from the title of the page it opens."
guide = "link-text"

[link-text-is-own-focus]
what = "These link words hold this post's own focus keyword, but they open another page."
why = "Link words tell Google which page answers a phrase, so these send your phrase elsewhere."
fix = "Rewrite the link to name the other page's topic, and keep your focus keyword for this post."
guide = "link-text"

[heading-order]
what = "This heading skips a level, such as a `####` right after a `##`."
why = "Screen readers and Google follow headings like a table of contents."
fix = "Change this heading to one level below the heading before it."
guide = "headings"

[missing-alt]
what = "This image has no description."
why = "People who cannot see the image, and Google, rely on the description to know what it shows."
fix = "Add a short description of what the image shows."
guide = "image-descriptions"

[thin-post]
what = "This post is shorter than the minimum this site sets."
why = "Short posts rarely answer a question fully, so Google seldom shows them."
fix = "Add the details, examples or steps a reader needs to act on the topic."
guide = "post-length"

[no-outbound-link]
what = "This post links to no other website."
why = "Links to good sources show readers and Google where your facts come from."
fix = "Add a link to a trusted source that backs up a claim in the post."
guide = "citing-sources"

[no-description]
what = "This post has no description."
why = "Search results show a description under the title, so without one Google picks any sentence."
fix = "Add `description:` to the header with one sentence that sums up the post."
guide = "descriptions"

[long-title]
what = "This post's title is longer than search results can show."
why = "Google cuts long titles short, so readers may not see the end of yours."
fix = "Shorten the title and keep the words that matter most at the start."
guide = "post-titles"

[long-description]
what = "This post's description is longer than search results can show."
why = "Google cuts long descriptions short, so the end of yours may never be read."
fix = "Shorten the description to one or two short sentences."
guide = "descriptions"

[short-title]
what = "This post's title is shorter than this site sets."
why = "A very short title says little about the post, so fewer people choose it in search results."
fix = "Add the words that tell a reader what they will learn."
guide = "post-titles"

[short-description]
what = "This post's description is shorter than this site sets."
why = "A very short description leaves Google to pick other words from the post for search results."
fix = "Write one or two sentences that say what the reader gets from the post."
guide = "descriptions"

[duplicate-title]
what = "Another post on this site has the same title."
why = "Google may show only one of the two, and readers cannot tell them apart."
fix = "Change the title so it says what makes this post different."
guide = "post-titles"

[duplicate-description]
what = "Another post on this site has the same description."
why = "A shared description makes two posts look the same in search results."
fix = "Rewrite the description so it sums up this post alone."
guide = "descriptions"

[keyword-stuffing]
what = "One phrase appears so often that the post reads as if written for machines."
why = "Google treats heavy repetition as spam and may show the post less."
fix = "Rewrite some of those sentences with other words, or cut the repeats."
guide = "keyword-stuffing"

[long-slug]
what = "This post's web address is long."
why = "Short addresses are easier to read, share and remember."
fix = "Shorten `slug:` to the few words that name the topic, before you publish."
guide = "web-addresses"

[slug-stopwords]
what = "This post's web address holds filler words such as \"the\" or \"of\"."
why = "Filler words make the address longer without telling readers or Google anything."
fix = "Remove the filler words from `slug:` before you publish."
guide = "web-addresses"

[slug-date]
what = "This post's web address holds a year."
why = "A year in the address makes the post look old once that year has passed."
fix = "Remove the year from `slug:` before you publish."
guide = "web-addresses"

[unicode-slug]
what = "This post's web address holds letters outside a to z, but the site keeps plain addresses."
why = "Accented letters turn into codes such as %C3%A9 when the address is copied into an email or a chat."
fix = "Change `slug:` to letters a to z, digits and hyphens, or allow accents with `slugs = \"unicode\"` in `site.toml`."
guide = "web-addresses"

[broken-wikilink]
what = "This `[[link]]` matches no post, page or glossary term in this language."
why = "Readers who follow it land on a page that does not exist."
fix = "Change it to the address of an existing page, or remove the brackets."
guide = "wikilinks"

[orphan-post]
what = "No other post on your site links to this post."
why = "Readers and Google find posts by following links, so this one is hard to find."
fix = "Add a link to this post from one or two related posts."
guide = "internal-links"

[one-inbound-link]
what = "Only one other post links to this post."
why = "A post with few links pointing to it looks less important to Google."
fix = "Link to this post from two or three more related posts."
guide = "internal-links"

[too-deep]
what = "Readers need too many clicks to reach this post from your home page."
why = "Google visits pages near the home page more often, and readers give up on long paths."
fix = "Link to this post from your home page, a menu or a popular post."
guide = "site-structure"

[missing-translation]
what = "This post has no version in one of your site's languages."
why = "Readers of that language cannot find this post, and Google cannot point them to it."
fix = "Write the translation and give both versions the same `translation:` key."
guide = "translations"

[stale-post]
what = "This post has not been updated for a long time."
why = "Readers and Google trust recent information more, and old facts may now be wrong."
fix = "Refresh this post: check its facts, update what changed and set `updated:` to today."
guide = "refreshing-posts"

[updated-date-wrong]
what = "This post's `updated:` date is before its publish date or still to come."
why = "A date that cannot be true makes readers and search engines doubt the whole page."
fix = "Change `updated:` to the day you last changed what the post says, or remove it."
guide = "refreshing-posts"

[fact-not-checked]
what = "This post uses a fact from `facts.toml` that has not been checked for a long time."
why = "A price, count or date that no longer holds misleads readers and the engines that quote your post."
fix = "Update the fact in `facts.toml` after checking it, and set its `checked` date to today."
guide = "fact-registry"

[near-duplicate]
what = "This post shares most of its text with another post on your site."
why = "Google shows only one of two near copies, so the two posts compete and both lose."
fix = "Merge the two posts into one, or rewrite this one to cover a different angle."
guide = "duplicate-content"

[glossary-term-not-linked]
what = "This post uses a term your glossary explains, without linking to it."
why = "A link to the definition helps new readers and shows Google how your pages relate."
fix = "Link the first use of the term to its glossary entry."
guide = "glossary"

[cluster-without-pillar]
what = "This post belongs to a topic group but does not link to the group's main post."
why = "Links to the main post show Google which page covers the topic best."
fix = "Add a link to the main post of this topic group."
guide = "topic-clusters"

[nofollow-internal-link]
what = "A link to another page of your own site tells Google not to follow it."
why = "Links between your pages help Google find them and judge their value, and this link passes nothing."
fix = "Remove `nofollow` from the link's `rel` attribute."
guide = "internal-links"

[insecure-internal-link]
what = "A link to your own site uses an address that starts with `http://`."
why = "Google prefers secure pages, and each click takes a slower detour before the secure page opens."
fix = "Change the address to start with `https://`, or use the path alone, such as `/blog/my-post/`."
guide = "secure-links"

[too-many-links]
what = "This post holds more links than your site's limit."
why = "Google shares a page's value across its links, so each one counts for less, and readers skim past them."
fix = "Cut the links that do not help the reader, or split the post into two."
guide = "internal-links"

[redirecting-link]
what = "A link in this post opens an old address that now sends readers on to another page."
why = "Each detour slows readers down, and Google trusts a direct link to the current address more."
fix = "Change the link to the post's current address."
guide = "redirects"

[cross-site-link]
what = "This post links to a sister site that runs on the same Khalid server."
why = "Google may read sister sites that link to each other as a link scheme and trust both less."
fix = "Remove the link, or keep it only where readers need it and mark it `nofollow`."
guide = "sister-sites"

[form-without-destination]
what = "A form in this post sends its answers nowhere."
why = "Readers who fill it in never hear back, so the visits search brings you are lost."
fix = "Give this form an email address or a service such as Zapier to send its answers to."
guide = "forms"

[answer-capsule]
what = "A question-style heading is not followed by a standalone answer of 40 to 60 words."
why = "Answer engines lift the first complete answer under a question, and readers scan for it too."
fix = "Write the whole answer in one paragraph of 40 to 60 words directly under the heading, before any detail or hedging."
guide = "answer-capsule"

[long-paragraph]
what = "A paragraph runs past 225 words, so it holds more than one idea."
why = "Readers lose the thread in a wall of text, and the paragraph's main point is hard for you or an engine to name."
fix = "Split it at each change of idea, into paragraphs of 75 to 225 words, one idea each."
guide = "plain-writing"

[no-about-page]
what = "The site has no About or contact page."
why = "A reader who cannot find who writes here trusts it less, and an engine citing the site has no author to credit."
fix = "Add an About or a contact page, with the authors' names and how to reach them."
guide = "author-proof"

[plain-answer]
what = "An answer paragraph uses hedge words, vague openers or a trailing which."
why = "Answer engines lift the clearest sentence they can find, and hedged text reads as unsure."
fix = "Write the claim outright in the answer paragraph and drop the hedge."
guide = "plain-writing"

[sourced-statistics]
what = "A number has no linked source and no year beside it."
why = "A reader, and an engine citing your post, needs to know where a number comes from and whether it still holds."
fix = "Link the number to its source, or write the year it held beside it, such as 47 percent (2024)."
guide = "sourced-statistics"

[fact-old-value]
what = "This post gives a value that the site's fact list says has changed."
why = "Two different values for one fact make readers and search engines trust the whole site less."
fix = "Replace the old value with the current one from `facts.toml`."
guide = "fact-registry"

[hard-to-read]
what = "This post is hard to read, because its sentences are long and many of its words are long."
why = "Readers who struggle leave early, and Google favours pages that answer people quickly."
fix = "Split long sentences, and use shorter everyday words where you can."
guide = "readability"

[no-focus-keyword]
what = "This post has no focus keyword, the phrase you want it to be found for."
why = "Without one, Khalid cannot check that the title, description and text are about one topic."
fix = "Add `focus_keyword:` to the header with the words a reader would search for."
guide = "focus-keyword"

[focus-not-in-title]
what = "The title search results show does not hold your focus keyword."
why = "The title is the headline in search results, and Google reads it first to learn the topic."
fix = "Rewrite `seo_title:`, or `title:` when there is none, so it holds the words of `focus_keyword:`."
guide = "focus-keyword"

[focus-not-in-h1]
what = "The main headline on the page does not hold your focus keyword."
why = "A reader who arrives from search looks for the words they typed in the headline before reading on."
fix = "Rewrite `title:` so it holds the words of `focus_keyword:`, as your search title does."
guide = "focus-keyword"

[focus-not-in-description]
what = "The description does not hold your focus keyword."
why = "Google shows the description under the title and marks the words a searcher typed in bold."
fix = "Rewrite the description so it holds the words of `focus_keyword:` once."
guide = "focus-keyword"

[focus-not-in-first-paragraph]
what = "The first paragraph does not hold your focus keyword."
why = "Readers decide in the first lines whether the post answers their search, and so does Google."
fix = "Use the words of `focus_keyword:` in the first paragraph, where it reads naturally."
guide = "focus-keyword"

[focus-not-in-subheading]
what = "None of the subheadings holds your focus keyword."
why = "Subheadings show readers and Google how the post is built around its topic."
fix = "Change one subheading so it holds the words of `focus_keyword:`."
guide = "focus-keyword"

[focus-not-in-address]
what = "The web address of this post does not hold your focus keyword."
why = "Searchers see the address in results, and a clear one tells them what the page is about."
fix = "Change `slug:` to the words of `focus_keyword:` before you publish, because a later change needs a redirect."
guide = "focus-keyword"

[focus-not-in-image-alt]
what = "None of the image descriptions holds your focus keyword."
why = "Google Images reads the descriptions to know what an image shows and which searches it fits."
fix = "Describe one image in words that include `focus_keyword:` if the image really shows it."
guide = "focus-keyword"

[focus-too-rare]
what = "Your focus keyword appears too rarely in the text."
why = "A post that names its topic only once or twice reads to Google as being about something else."
fix = "Use the words of `focus_keyword:` a few more times where they fit, about once every 200 words."
guide = "keyword-density"

[focus-too-often]
what = "Your focus keyword appears so often that the post reads as if written for machines."
why = "Google treats heavy repetition as spam and may show the post less."
fix = "Replace some repeats of `focus_keyword:` with other words, such as a close phrase or a pronoun."
guide = "keyword-density"

[secondary-keyword-unused]
what = "One of your secondary keywords never appears in the text."
why = "A close phrase only helps the post when readers and Google can find it in the text."
fix = "Use the words this message names at least once, or remove them from `secondary_keywords:`."
guide = "focus-keyword"

[overlapping-collections]
what = "Two collections, the folders that group your posts, could give two posts the same address."
why = "Only one post can live at an address, so the other could vanish from your site and from Google."
fix = "Change the `permalink` of one collection in `routes.toml` so their addresses differ."
guide = "collections"

[invalid-structured-data]
what = "The search result details on this page miss a property Google needs."
why = "Google ignores details it cannot read in full, so the post loses its richer search result."
fix = "Add the property this message names to the block it belongs to."
guide = "structured-data"

[section-wants-own-page]
what = "A long section never names the post's subject, so it reads as a second topic."
why = "A page on one subject is easier to find and to quote, and the side topic gets no page of its own."
fix = "Move the section to its own post and link to it, or tie it to the post's subject in its heading and text."
guide = "page-or-section"

[section-repeats-post]
what = "A section covers the whole subject of another post on the site."
why = "Two pages on one subject compete for the same searches, and neither does as well as one would."
fix = "Shorten the section to a summary and link to the post this message names."
guide = "page-or-section"

[post-fits-section]
what = "This short post covers what a section of another post already covers."
why = "Two pages on one subject compete for the same searches, and the short one rarely wins."
fix = "Move what is new here into that section, then redirect this post's address to that post."
guide = "page-or-section"

[comparison-without-table]
what = "This post weighs choices against each other but has no table that sets them side by side."
why = "Readers scan a table faster than paragraphs, and AI search tools quote its rows as they stand."
fix = "Add a table with one column per choice and one row for each point you compare."
guide = "comparison-pages"

[comparison-answer-late]
what = "The opening paragraph does not name both things the title compares."
why = "Readers and AI search tools look for the verdict first, and a page that hides it loses them."
fix = "Write an opening paragraph that names both choices and says which one suits which reader."
guide = "comparison-pages"

[fewer-picks-than-title]
what = "The title promises more picks than the post gives a heading of their own."
why = "Readers who count fewer picks than the title promised stop trusting the page."
fix = "Add a heading for each missing pick, or change the number in the title."
guide = "comparison-pages"

[review-without-rating]
what = "This review has no review block with your rating."
why = "Without the block, search results cannot show your score, and readers must hunt for your verdict."
fix = "Add a review block with the item, your score and a short verdict."
guide = "comparison-pages"

[brief-question-unanswered]
what = "The post's brief lists a question that no heading in the post asks."
why = "A reader or an answer engine looking for that question cannot find where the post answers it."
fix = "Add a heading that asks the question, with the answer right under it, or remove it from the brief."
guide = "post-briefs"

[brief-term-missing]
what = "The post's brief lists a term that the post never uses."
why = "The brief named the things a full answer covers, and this one is left out."
fix = "Use the term where the post explains it, or remove it from the brief."
guide = "post-briefs"

[brief-link-missing]
what = "The post's brief lists a page that the post does not link to."
why = "The brief planned this link so readers and search engines reach the related page from here."
fix = "Link to the page where the post mentions its subject, or remove it from the brief."
guide = "post-briefs"
