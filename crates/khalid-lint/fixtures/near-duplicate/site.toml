[[posts]]
locale = "en"
slug = "internal-links-explained"
body_text = """
An internal link points from one post on your site to another post on the
same site. Readers follow these links to the next helpful page, and search
engines follow them to discover pages and to understand which ones matter
most. Add a few links to related posts in every new article you write.
"""

