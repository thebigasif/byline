[package]
name = "khalid-lint"
version = "0.0.0"
description = "The Khalid linter: rules that refuse a weak post and explain why in plain words."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde"] }
khalid-core = { path = "../khalid-core", version = "0.0.0" }
serde.workspace = true
thiserror.workspace = true
toml = "0.9"

[dev-dependencies]
khalid-core = { path = "../khalid-core", version = "0.0.0", features = ["test-util"] }
serde_json.workspace = true

[lints]
workspace = true
