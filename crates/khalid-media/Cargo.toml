[package]
name = "khalid-media"
version = "0.0.0"
description = "The media library, and images resized and encoded at publish in responsive sizes, cached by content hash."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde"] }
fast_image_resize = { version = "6", default-features = false, features = ["std"] }
hmac = "0.13"
http = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
khalid-core = { path = "../khalid-core", version = "0.0.0" }
khalid-outbound = { path = "../khalid-outbound", version = "0.0.0" }
rayon = "1"
serde.workspace = true
toml = "0.9"
tokio = { workspace = true, features = ["rt", "sync"] }
webp = { version = "0.3", default-features = false }
sha2 = "0.11"
thiserror.workspace = true

[dev-dependencies]
divan = "0.1"
khalid-core = { path = "../khalid-core", version = "0.0.0", features = ["test-util"] }
khalid-outbound = { path = "../khalid-outbound", version = "0.0.0", features = ["test-util"] }
tempfile = "3"
wiremock = "0.6"

[[bench]]
name = "resize"
harness = false

[lints]
workspace = true
