[package]
name = "khalid-audit"
version = "0.0.0"
description = "The site audit: crawl a blog the way Ahrefs and Semrush do, check every page, and score it."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }
http = "1"
khalid-core.workspace = true
khalid-outbound = { path = "../khalid-outbound", version = "0.0.0" }
percent-encoding = "2"
roxmltree = "0.21"
scraper = "0.29"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio.workspace = true

[lints]
workspace = true
