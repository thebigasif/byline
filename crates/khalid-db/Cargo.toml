[package]
name = "khalid-db"
version = "0.0.0"
description = "The SQLite file in data/: the index rebuilt from content files, and what visitors create."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3", default-features = false }
getrandom = "0.4"
khalid-alerts = { path = "../khalid-alerts", version = "0.0.0" }
khalid-analytics = { path = "../khalid-analytics", version = "0.0.0" }
khalid-api = { path = "../khalid-api", version = "0.0.0" }
khalid-auth = { path = "../khalid-auth", version = "0.0.0" }
khalid-comments = { path = "../khalid-comments", version = "0.0.0" }
khalid-core.workspace = true
khalid-forms = { path = "../khalid-forms", version = "0.0.0" }
khalid-newsletter = { path = "../khalid-newsletter", version = "0.0.0" }
khalid-seo = { path = "../khalid-seo", version = "0.0.0" }
khalid-search = { path = "../khalid-search", version = "0.0.0" }
khalid-webhooks = { path = "../khalid-webhooks", version = "0.0.0" }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate", "chrono"] }
thiserror.workspace = true

[dev-dependencies]
khalid-api = { path = "../khalid-api", version = "0.0.0", features = ["test-util"] }
khalid-core = { workspace = true, features = ["test-util"] }
tempfile = "3"
tokio.workspace = true

[lints]
workspace = true
