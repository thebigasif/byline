[package]
name = "khalid-mail"
version = "0.0.0"
description = "How a site's mail leaves: SMTP, Resend or Postmark, chosen in site.toml."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Sending to a stand-in API address, for this crate's tests and other crates' tests.
test-util = []

[dependencies]
khalid-core.workspace = true
khalid-newsletter = { path = "../khalid-newsletter", version = "0.0.0" }
khalid-outbound = { path = "../khalid-outbound", version = "0.0.0" }
# SMTP (decision 8 of 2026-10-27), on rustls with ring and the system's
# certificate store, as the shared HTTP client is; no OpenSSL.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "rustls-platform-verifier"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
khalid-mail = { path = ".", version = "0.0.0", features = ["test-util"] }
khalid-outbound = { path = "../khalid-outbound", version = "0.0.0", features = ["test-util"] }
toml = "0.9"
wiremock = "0.6"

[lints]
workspace = true
