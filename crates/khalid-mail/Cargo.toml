[package]
name = "khalid-mail"
version = "0.0.0"
description = "How a site's mail leaves: SMTP, Resend or Postmark, chosen in site.toml."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Sending to a stand-in API address, for this crate's tests and other crates' tests.
test-util = []

[dependencies]
khalid-core = { path = "../khalid-core", version = "0.0.0" }
khalid-newsletter = { path = "../khalid-newsletter", version = "0.0.0" }
khalid-outbound = { path = "../khalid-outbound", version = "0.0.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
khalid-mail = { path = ".", version = "0.0.0", features = ["test-util"] }
khalid-outbound = { path = "../khalid-outbound", version = "0.0.0", features = ["test-util"] }
tokio.workspace = true
wiremock = "0.6"

[lints]
workspace = true
