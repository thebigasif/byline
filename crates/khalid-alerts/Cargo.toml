[package]
name = "khalid-alerts"
version = "0.0.0"
description = "Alerts for a site's owner: what each problem is, the checks that find it, and remembering what was raised."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# MemoryRaised, for this crate's tests and other crates' tests.
test-util = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
khalid-alerts = { path = ".", version = "0.0.0", features = ["test-util"] }
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
