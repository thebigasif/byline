[package]
name = "khalid-https"
version = "0.0.0"
description = "HTTPS with its own certificate: a TLS listener, and Let's Encrypt certificates got and renewed over ACME."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing.workspace = true
x509-parser = { version = "0.18", default-features = false }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
http-body-util = "0.1"
khalid-core = { path = "../khalid-core", version = "0.0.0" }
khalid-outbound = { path = "../khalid-outbound", version = "0.0.0", features = ["test-util"] }
khalid-server = { path = "../khalid-server", version = "0.0.0" }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio = { workspace = true, features = ["io-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
