[package]
name = "khalid-perf"
version = "0.0.0"
description = "Generated large sites and the measures behind the performance budgets."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false }
khalid-content = { path = "../khalid-content", version = "0.0.0" }
khalid-core.workspace = true
khalid-lint.workspace = true
khalid-render = { path = "../khalid-render", version = "0.0.0" }
thiserror.workspace = true

[dev-dependencies]
divan = "0.1"
khalid-core = { workspace = true, features = ["test-util"] }
tempfile = "3"

[[bench]]
name = "render"
harness = false

[[bench]]
name = "lint"
harness = false

[lints]
workspace = true
