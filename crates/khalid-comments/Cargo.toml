[package]
name = "khalid-comments"
version = "0.0.0"
description = "Readers' comments on posts: the form, spam checks, rate limits, moderation and threads."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# MemoryCommentStore, for this crate's tests and other crates' tests.
test-util = []

[dependencies]
axum = { version = "0.8", default-features = false, features = ["form", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
getrandom = "0.4"
khalid-api = { path = "../khalid-api", version = "0.0.0" }
khalid-core = { path = "../khalid-core", version = "0.0.0" }
khalid-webhooks = { path = "../khalid-webhooks", version = "0.0.0" }
serde.workspace = true
sha2 = "0.11"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
toml = "0.9"
tracing.workspace = true

[dev-dependencies]
khalid-comments = { path = ".", version = "0.0.0", features = ["test-util"] }
khalid-core = { path = "../khalid-core", version = "0.0.0", features = ["test-util"] }
khalid-outbound = { path = "../khalid-outbound", version = "0.0.0", features = ["test-util"] }
khalid-webhooks = { path = "../khalid-webhooks", version = "0.0.0", features = ["test-util"] }
serde_json.workspace = true
tokio.workspace = true
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

[lints]
workspace = true
