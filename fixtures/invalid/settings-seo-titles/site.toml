# Breaks one rule: a title template uses only the known variables. The
# exact message khalid --site prints for it is in expected.txt beside this file.
name = "Field Notes on SEO"
address = "https://www.example.com"
mount = "/blog/"
default_language = "en"
languages = ["en", "de"]

[seo.titles]
tagline = "Plain notes on search"

[seo.titles.post]
title = "{title} {sep} {sitename}"
