name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Contributor licence agreement
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A fine-grained personal access token with contents:write on the
          # signatures repository. The founder adds it under Settings, Secrets,
          # as CLA_SIGNATURES_TOKEN. Until then this job fails on outside pull
          # requests, which is the safe direction.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/thebigasif/byline/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'thebigasif,dependabot[bot]'
          remote-organization-name: 'thebigasif'
          remote-repository-name: 'byline-cla-signatures'
          create-file-commit-message: 'chore(cla): create the signatures file'
          signed-commit-message: 'chore(cla): $contributorName has signed the CLA'
          custom-notsigned-prcomment: 'Thank you for the pull request. Please read CLA.md and sign it with the comment below. You sign once.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          lock-pullrequest-aftermerge: false
