name: Builder

# One maintainer-started coding run on GitHub's own runners: Claude Code
# takes one task brief and pushes it on task/gh-<name>-* branches. It opens
# no pull requests: it leaves a title and body per branch in the run's
# artifact, and the maintainer opens them, which also starts CI. Only people
# with write access can start it, and forks never see the secret.
on:
  workflow_dispatch:
    inputs:
      name:
        description: Short run name, used in branch names (letters, digits, dashes)
        required: true
      brief:
        description: The task brief
        required: true

permissions:
  contents: write

concurrency:
  group: builder-${{ inputs.name }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build ${{ inputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check the run name
        env:
          RUN_NAME: ${{ inputs.name }}
        run: |
          [[ "$RUN_NAME" =~ ^[a-z0-9-]{1,30}$ ]] || { echo "Use 1 to 30 lowercase letters, digits or dashes."; exit 1; }
      - name: Toolchain from rust-toolchain.toml
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Tools
        uses: taiki-e/install-action@v2
        with:
          tool: just,typos-cli,taplo-cli,cargo-nextest,cargo-deny,cargo-machete
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Admin packages
        run: npm ci
        working-directory: admin
      - name: Git identity
        run: |
          git config user.name "khalid-builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Read scripts/maintainer/builder-brief.md and follow it exactly, with these changes for this run:
            - Name every branch task/gh-${{ inputs.name }}-<slug>, created from origin/main or from your own previous part.
            - Do not open pull requests and do not wait for CI: no checks start while you work. For each branch, write its pull request as a file in $RUNNER_TEMP/prs/ named after the branch with slashes as double dashes, ending in .md: the first line is the Conventional Commits title, then a blank line, then the body the template asks for, then a line `Base: <base branch>`. When every part is pushed and has its file, print a short summary and stop.
            - The Performance budgets job is not yours to fix.
            - Run `just check` before each push.

            The task:
            ${{ inputs.brief }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 500
            --allowedTools "Bash(cargo *),Bash(just *),Bash(git *),Bash(rustup *),Bash(ls *),Bash(cat *),Bash(grep *),Bash(rg *),Bash(find *),Bash(sed *),Bash(awk *),Bash(wc *),Bash(head *),Bash(tail *),Bash(diff *),Bash(mkdir *),Bash(cp *),Bash(mv *),Bash(typos*),Bash(taplo *),Bash(sqlite3 *),Bash(npm *),Bash(./scripts/*),Bash(scripts/*),Read,Edit,Write,Glob,Grep,WebFetch,WebSearch"
            --disallowedTools "Bash(gh pr merge*),Bash(git push --force*),Bash(git push -f*),Bash(sudo *)"
      - name: Keep the pull request texts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prs-${{ inputs.name }}
          path: ${{ runner.temp }}/prs/
          if-no-files-found: warn
