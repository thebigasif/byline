name: Builder

# One maintainer-started coding run on GitHub's own runners: Claude Code
# takes one task brief, builds it on task/gh-<name>-* branches and opens
# pull requests. Only people with write access can start it, and pull
# requests from forks never see the secret.
on:
  workflow_dispatch:
    inputs:
      name:
        description: Short run name, used in branch names (letters, digits, dashes)
        required: true
      brief:
        description: The task brief
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: builder-${{ inputs.name }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build ${{ inputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check the run name
        env:
          RUN_NAME: ${{ inputs.name }}
        run: |
          [[ "$RUN_NAME" =~ ^[a-z0-9-]{1,30}$ ]] || { echo "Use 1 to 30 lowercase letters, digits or dashes."; exit 1; }
      - name: Toolchain from rust-toolchain.toml
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Tools
        uses: taiki-e/install-action@v2
        with:
          tool: just,typos-cli,taplo-cli,cargo-nextest,cargo-deny,cargo-machete
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Admin packages
        run: npm ci
        working-directory: admin
      - name: Git identity
        run: |
          git config user.name "khalid-builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Read scripts/maintainer/builder-brief.md and follow it exactly, with these changes for this run:
            - Name every branch task/gh-${{ inputs.name }}-<slug>, created from origin/main or from your own previous part.
            - Do not wait for CI: no checks start while you work. When every part is pushed and open as a pull request, print a short summary and stop.
            - The Performance budgets job is not yours to fix.
            - Run `just check` before each push.

            The task:
            ${{ inputs.brief }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 500
            --allowedTools "Bash(cargo *),Bash(just *),Bash(git *),Bash(gh pr create*),Bash(gh pr view*),Bash(gh pr list*),Bash(rustup *),Bash(ls *),Bash(cat *),Bash(grep *),Bash(rg *),Bash(find *),Bash(sed *),Bash(awk *),Bash(wc *),Bash(head *),Bash(tail *),Bash(diff *),Bash(mkdir *),Bash(cp *),Bash(mv *),Bash(typos*),Bash(taplo *),Bash(sqlite3 *),Bash(npm *),Bash(./scripts/*),Bash(scripts/*),Read,Edit,Write,Glob,Grep,WebFetch,WebSearch"
            --disallowedTools "Bash(gh pr merge*),Bash(git push --force*),Bash(git push -f*),Bash(sudo *)"
      - name: Start CI on the pushed branches
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NAME: ${{ inputs.name }}
        run: |
          git fetch -q origin "+refs/heads/task/gh-${RUN_NAME}-*:refs/remotes/origin/task/gh-${RUN_NAME}-*" || true
          for ref in $(git for-each-ref --format='%(refname:strip=3)' "refs/remotes/origin/task/gh-${RUN_NAME}-*"); do
            gh workflow run ci.yml --ref "$ref"
            echo "CI started on $ref"
          done
