name: Agent review

# Every pull request gets an agent review against docs/standards/review.md before
# a person reads it. Runs only when the founder has added ANTHROPIC_API_KEY to the
# repository secrets and set the AGENT_REVIEW variable to "on". Otherwise the job
# is skipped, and the self-review pasted in the pull request is the record.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    # Skipped without a runner unless the AGENT_REVIEW repository variable is
    # "on", so pull requests do not queue for a job that would only find the
    # secret missing. Set the variable when ANTHROPIC_API_KEY is added.
    if: github.event.pull_request.draft == false && vars.AGENT_REVIEW == 'on'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Secret present?
        id: key
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Review with the khalid-review skill
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Load the khalid-review and rust-review skills. Review this pull request
            against docs/standards/review.md and docs/standards/RULES.md. Score the
            ten-point rubric honestly. Post the review as a pull request review with
            line comments on the findings. Request changes on any must fix.
          claude_args: '--max-turns 30'
      - name: Skipped
        if: steps.key.outputs.present == 'false'
        run: echo "ANTHROPIC_API_KEY is not set. The author's self-review in the pull request is the record."
