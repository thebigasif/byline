name: Release

# A version tag such as v0.1.0 builds the binary for six platforms and
# attaches it, with checksums, to a draft GitHub release. The founder reads
# the draft and publishes it. Nothing builds unless `just check` passes on the
# tagged commit first. Releases are built here, never by hand (docs/standards/git.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The binary embeds what admin/dist holds, so the admin is built once,
  # first, and every later job starts from the same files (gap audit 2, F8).
  admin:
    name: Admin bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Build
        working-directory: admin
        run: npm ci && npm run build && node scripts/size-budget.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/dist
          if-no-files-found: error

  check:
    name: just check
    needs: admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # With the bundle present, the serve test insists that /admin/ answers
      # with the app, so a release cannot ship without it.
      - uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: admin/dist
      - name: Toolchain from rust-toolchain.toml
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Tools
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny,cargo-machete,typos
      - name: Everything CI checks
        run: just check

  build:
    name: Build ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # Linux builds are musl and fully static, so one file runs on any
        # distribution and in an empty Docker image. Their names stay
        # linux-x86_64 and linux-aarch64, so install links do not change.
        # The Intel Mac build is made on an Apple silicon runner.
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-musl, exe: "", runs: true }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, exe: "", runs: true }
          - { name: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin, exe: "", runs: true }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin, exe: "", runs: false }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, exe: ".exe", runs: true }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: admin/dist
      - name: Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - name: The musl C compiler, for the C parts of dependencies
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # The release profile in Cargo.toml strips symbols, so the binary
      # comes out of cargo already stripped.
      - name: Build
        shell: bash
        run: |
          target="${{ matrix.target }}"
          # Only C code for the target uses musl-gcc; build scripts that
          # run on the runner itself keep the system compiler.
          if [[ "$target" == *-musl ]]; then
            export "CC_${target//-/_}=musl-gcc"
          fi
          cargo build --release --locked -p khalid --target ${{ matrix.target }}
      - name: Name the file for the release
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/khalid${{ matrix.exe }}" \
             "dist/khalid-${{ github.ref_name }}-${{ matrix.name }}${{ matrix.exe }}"
      - name: The binary starts
        if: matrix.runs
        shell: bash
        run: |
          file="dist/khalid-${{ github.ref_name }}-${{ matrix.name }}${{ matrix.exe }}"
          "$file" --version
      - name: The Linux binary is fully static
        if: endsWith(matrix.target, '-musl')
        run: |
          file="dist/khalid-${{ github.ref_name }}-${{ matrix.name }}"
          if ldd "$file" 2>&1 | grep -q '=>'; then
            echo "The Linux build links to shared libraries, so it would not run everywhere. Check the musl build settings."
            ldd "$file"; exit 1
          fi
      - name: The binary carries the admin
        if: matrix.runs && runner.os != 'Windows'
        shell: bash
        run: |
          file="$PWD/dist/khalid-${{ github.ref_name }}-${{ matrix.name }}${{ matrix.exe }}"
          site="$RUNNER_TEMP/site"
          cp -r fixtures/demo-site "$site"
          "$file" --site "$site" serve --listen 127.0.0.1:8099 > "$RUNNER_TEMP/serve.log" 2>&1 &
          server=$!
          for _ in $(seq 60); do
            curl -fsS -o /dev/null http://127.0.0.1:8099/admin/ && break
            sleep 0.5
          done
          status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/admin/ || true)
          kill "$server" || true
          if [ "$status" != "200" ]; then
            echo "/admin/ answered $status, not 200. The release would have no admin. Check the admin bundle step."
            cat "$RUNNER_TEMP/serve.log"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: khalid-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: khalid-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum khalid-* > SHA256SUMS && cat SHA256SUMS
      - name: Draft the release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            Binaries for Linux (x86_64 and ARM, fully static), macOS (Apple silicon and Intel) and Windows. Each one holds the admin. Check a download against `SHA256SUMS`.
            The Docker image is `ghcr.io/${{ github.repository }}`, tagged with this version.
            What changed is in CHANGELOG.md.

  # The scratch image from the Dockerfile, for x86_64 and ARM, holding the
  # same static musl binaries the release attaches. It goes to the GitHub
  # container registry with the workflow's own token, so no secret is set
  # up by hand. A prerelease tag gets only its version tag, never latest.
  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: khalid-linux-*
          merge-multiple: true
      - name: One binary per Docker processor name
        run: |
          mkdir -p dist/amd64 dist/arm64
          cp "artifacts/khalid-${{ github.ref_name }}-linux-x86_64" dist/amd64/khalid
          cp "artifacts/khalid-${{ github.ref_name }}-linux-aarch64" dist/arm64/khalid
      # The image's last step runs the binary, so the ARM image needs an
      # emulator on this x86_64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: BINARY=prebuilt
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
